root = "."
tmp_dir = ".tmp"

[build]
cmd = "go build -o ./.tmp/sub ./cmd/sub"
bin = "./.tmp/sub"
full_bin = "./.tmp/sub"
include_ext = ["go"]
exclude_dir = [".git", ".tmp", "vendor", "openspec", ".opencode"]
exclude_regex = ["_test.go"]
delay = 300
stop_on_error = true
send_interrupt = true

[screen]
clear_on_rebuild = true
